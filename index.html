        function escapeAttr(str) {
            return String(str)

                .replace(/"/g, "&quot;")

                .replace(/>/g, "&gt;");

            const list = (domains || []).map(d => d.trim()).filter(Boolean);
            return list.length ? list.join('\n') : '[domain]';
        }

        function formatDomainInline(domains) {
            const list = (domains || []).map(d => d.trim()).filter(Boolean);
            return list.length ? list.join(', ') : '[domain]';

            const list = (domains || []).map(d => d.trim()).filter(Boolean);
            return list.length ? list[0] : '[domain]';
        }

        function formatEmailList(names) {

            if (!list.length) return '';
            return `\n\nThey are:\n${list.join('\n')}`;

        function formatUrlList(urls) {

        // Live API Multi-Domain & Multi-Record Query Handler (Bulk Textarea Input)
        let liveDnsResultCache = {};
        async function runBulkDomainDnsLookup(domainsText) {
            if (!domainsText) {
                alert('Please enter at least one domain in the text box.');
                return;
            }
            
            const domainList = domainsText.split('\n').map(d => d.trim()).filter(Boolean);
            if (domainList.length === 0) {
                alert('No valid domain names found.');
                return;
            }
            
            const recordTypes = ['A', 'MX', 'NS'];
            const box = document.getElementById('livePreviewBox');
            
            if(box) box.textContent = `Querying live DNS records (A, MX, NS, mail.domain) across ${domainList.length} domain(s) via Cloudflare DoH API...`;
            
            let fullReport = `Multi-Domain Global DNS Diagnostic Report\n---------------------------------------------------------------\nTimestamp: ${new Date().toUTCString()}\n---------------------------------------------------------------\n\n`;

            for (const domain of domainList) {
                fullReport += `[+] DOMAIN: ${domain}\n`;
                
                // Query standard records (A, MX, NS)
                for (const rType of recordTypes) {
                    try {
                        const res = await fetch(`https://cloudflare-dns.com/dns-query?name=${domain}&type=${rType}`, {
                            headers: { 'Accept': 'application/dns-json' }
                        });
                        const json = await res.json();
                        if (json.Answer && json.Answer.length > 0) {
                            json.Answer.forEach(ans => {
                                fullReport += `   - ${rType.padEnd(8, ' ')} -> ${ans.data} (TTL: ${ans.TTL}s)\n`;
                            });
                        } else {
                            fullReport += `   - ${rType.padEnd(8, ' ')} -> No records found\n`;
                        }
                    } catch (e) {
                        fullReport += `   - ${rType.padEnd(8, ' ')} -> Query Error\n`;
                    }
                }

                // Query specific mail.domain record explicitly
                try {
                    const mailHost = `mail.${domain}`;
                    const mailRes = await fetch(`https://cloudflare-dns.com/dns-query?name=${mailHost}&type=A`, {
                        headers: { 'Accept': 'application/dns-json' }
                    });
                    const mailJson = await mailRes.json();
                    if (mailJson.Answer && mailJson.Answer.length > 0) {
                        mailJson.Answer.forEach(ans => {
                            fullReport += `   - ${mailHost.padEnd(10, ' ')} -> ${ans.data} (TTL: ${ans.TTL}s)\n`;
                        });
                    } else {
                        fullReport += `   - ${mailHost.padEnd(10, ' ')} -> No A record found\n`;
                    }
                } catch (e) {
                    fullReport += `   - mail.${domain} -> Query Error\n`;
                }

                fullReport += `---------------------------------------------------------------\n`;
            }

            liveDnsResultCache['dns-lookup-tool'] = fullReport;
            if(box) box.textContent = fullReport;
        }

        const templateDefaults = {};

            destinationPlan: 'e.g., cPanel Dedicated',

            emailAccountNames: 'e.g., user@example.com',

            emailVerified: 'e.g., Yes (5/5 accounts)',
            backupDeleted: 'e.g., Pending deletion'
        };

        let activeKey = 'dns-managed-email-web';

        function switchTab(key) {
            activeKey = key;

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.getAttribute('data-target') === key) {
                    btn.classList.add('bg-emerald-100', 'dark:bg-slate-700', 'text-emerald-800', 'dark:text-blue-300', 'font-semibold');
                    btn.classList.remove('hover:bg-emerald-50', 'dark:hover:bg-slate-700/50');
                } else {
                    btn.classList.remove('bg-emerald-100', 'dark:bg-slate-700', 'text-emerald-800', 'dark:text-blue-300', 'font-semibold');
                    btn.classList.add('hover:bg-emerald-50', 'dark:hover:bg-slate-700/50');
                }
            });

            renderTemplateView(key);

            if(window.innerWidth < 1024) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        function renderArrayField(tKey, varKey, values, labelName) {
            const items = values.length ? values : [];
            const ph = FIELD_PLACEHOLDERS[varKey] || 'Enter value...';
            const itemsHtml = items.map((val, idx) => `
                <div class="flex items-center space-x-2 mb-2">
                    <input type="text" value="${escapeAttr(val)}" placeholder="${ph}" oninput="setArrayVar('${tKey}','${varKey}', ${idx}, this.value)"
                        class="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 px-3 py-2 text-xs text-slate-800 dark:text-slate-100 placeholder:text-slate-400 focus:border-emerald-600 dark:focus:border-blue-500 focus:outline-none transition-theme">
                    <button type="button" onclick="removeArrayItem('${tKey}','${varKey}', ${idx})" class="text-slate-400 hover:text-red-500 px-2 py-2 border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-900" title="Remove">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `).join('');

            const emptyHtml = items.length ? '' : '<p class="text-xs text-slate-400 italic mb-2">None added yet</p>';
            const addLabel = ARRAY_ADD_LABELS[varKey] || `Add ${labelName.toLowerCase()}`;

            return `
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">${labelName}</label>
                    <div>${itemsHtml}${emptyHtml}</div>
                    <button type="button" onclick="addArrayItem('${tKey}','${varKey}')" class="text-xs text-emerald-700 dark:text-blue-400 font-semibold hover:underline mt-1 flex items-center">
                        <i class="fa-solid fa-plus mr-1"></i> ${addLabel}
                    </button>
                </div>
            `;
        }

        const MULTILINE_FIELDS = new Set(['sourceDisk', 'destDisk', 'bulkDomainsText']);

        function renderTemplateView(key) {
            const tmpl = templates[key];
            if(!tmpl) return;

            document.getElementById('currentCategoryTitle').textContent = tmpl.title;
            const container = document.getElementById('templateContainer');

            let formFieldsHtml = '';
            for (const [varKey, varVal] of Object.entries(tmpl.vars)) {
                let labelName = varKey === 'bulkDomainsText' ? 'DOMAINS LIST (ONE PER LINE)' : varKey.replace(/([A-Z])/g, ' $1').toUpperCase();
                let ph = FIELD_PLACEHOLDERS[varKey] || 'Enter details...';

                if (Array.isArray(varVal)) {
                    formFieldsHtml += renderArrayField(key, varKey, varVal, labelName);
                } else if (MULTILINE_FIELDS.has(varKey)) {
                    let textPlaceholder = varKey === 'bulkDomainsText' ? 'example.com\nexample.net\nmy-domain.org' : '[root@server ~]# du -sch *\n12M\tbackup\n1.8G\tdomains';
                    formFieldsHtml += `
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">${labelName}</label>
                            <textarea rows="8" oninput="setScalarVar('${key}','${varKey}', this.value)"
                                placeholder="${textPlaceholder}"

                            ${varKey === 'bulkDomainsText' ? '<p class="text-[11px] text-slate-400 mt-1">Type or paste domain names, one per line.</p>' : '<p class="text-[11px] text-slate-400 mt-1">Paste full du -sch command output here.</p>'}
                        </div>
                    `;
                } else {
                    formFieldsHtml += `
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">${labelName}</label>
                            <input type="text" value="${escapeAttr(varVal)}" placeholder="${ph}" oninput="setScalarVar('${key}','${varKey}', this.value)"
                                class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 px-3 py-2 text-xs text-slate-800 dark:text-slate-100 placeholder:text-slate-400 focus:border-emerald-600 dark:focus:border-blue-500 focus:outline-none transition-theme">
                        </div>
                    `;
                }
            }

            // Special Action Button for Multi-Domain DNS Tool
            let extraActionHtml = '';
            if (key === 'dns-lookup-tool') {
                extraActionHtml = `
                    <button type="button" onclick="runBulkDomainDnsLookup(templates['dns-lookup-tool'].vars.bulkDomainsText)" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-md transition-all flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-satellite-dish"></i>
                        <span>Run Multi-Record Query</span>
                    </button>
                `;
            }

            const currentText = tmpl.getTemplate(tmpl.vars);

            container.innerHTML = `
                <!-- Customizer Grid Container -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

                    <!-- Left Column: Form Controls (Customizer) -->
                    <div class="lg:col-span-4 bg-white dark:bg-slate-800 border border-emerald-200 dark:border-slate-700 p-5 shadow-sm space-y-4 transition-theme">
                        <div class="flex items-center justify-between pb-3 border-b border-emerald-100 dark:border-slate-700/50">
                            <h3 class="font-bold text-xs flex items-center text-slate-800 dark:text-white uppercase tracking-wider">
                                <i class="fa-solid fa-sliders text-emerald-600 dark:text-blue-400 mr-2"></i>
                                Configure Details
                            </h3>
                            <button type="button" onclick="resetDefaults('${key}')" class="text-xs text-slate-400 hover:text-emerald-700 dark:hover:text-blue-400 underline">Clear All</button>
                        </div>
                        <div class="space-y-4 max-h-[600px] overflow-y-auto pr-1">
                            ${formFieldsHtml}
                        </div>
                        ${extraActionHtml}
                    </div>

                    <!-- Right Column: Live Output & Copy -->
                    <div class="lg:col-span-8 bg-white dark:bg-slate-800 border border-emerald-200 dark:border-slate-700 shadow-sm overflow-hidden flex flex-col transition-theme">
                        <!-- Card Header -->
                        <div class="p-5 border-b border-emerald-200 dark:border-slate-700 flex items-center justify-between bg-emerald-50/40 dark:bg-slate-800/50">
                            <div>
                                <span class="inline-block px-2.5 py-1 text-xs font-semibold ${tmpl.badgeColor} mb-1">${tmpl.category}</span>
                                <h3 class="text-xs font-bold text-slate-800 dark:text-white truncate max-w-sm sm:max-w-md">${tmpl.title}</h3>
                            </div>
                            <button type="button" onclick="copyActiveTemplate('${key}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 dark:bg-blue-600 dark:hover:bg-blue-700 text-white text-xs font-semibold shadow-md shadow-emerald-500/20 dark:shadow-blue-500/20 transition-all flex items-center space-x-2 flex-shrink-0">
                                <i class="fa-regular fa-copy"></i>
                                <span>Copy Customized</span>
                            </button>
                        </div>

                        <!-- Live Preview Box -->
                        <div class="p-6 flex-1">
                            <div id="livePreviewBox" class="bg-slate-50 dark:bg-slate-900 p-5 border border-slate-300 dark:border-slate-700 font-mono text-xs leading-relaxed whitespace-pre-wrap select-all overflow-x-auto text-slate-700 dark:text-slate-300 min-h-[500px] max-h-[680px]">${escapeHtml(currentText)}</div>
                        </div>

                        <!-- Card Footer -->
                        <div class="px-6 py-3 bg-slate-50 dark:bg-slate-800/50 border-t border-emerald-200 dark:border-slate-700 flex items-center justify-end text-xs text-slate-500 dark:text-slate-400">
                            <button type="button" onclick="copyActiveTemplate('${key}')" class="text-emerald-700 dark:text-blue-400 font-semibold hover:underline">
                                <i class="fa-regular fa-copy mr-1"></i> Copy to Clipboard
                            </button>
                        </div>
                    </div>

                </div>
            `;
        }

        function refreshPreview(key) {
            const tmpl = templates[key];
            if(!tmpl) return;
            const box = document.getElementById('livePreviewBox');
            if(box) {
                if (key === 'dns-lookup-tool' && liveDnsResultCache['dns-lookup-tool']) {
                    box.textContent = liveDnsResultCache['dns-lookup-tool'];
                } else {
                    box.textContent = tmpl.getTemplate(tmpl.vars);
                }
            }
        }

        function setScalarVar(key, varKey, value) {
            templates[key].vars[varKey] = value;
            refreshPreview(key);
        }

        function setArrayVar(key, varKey, index, value) {
            templates[key].vars[varKey][index] = value;
            refreshPreview(key);
        }

        function addArrayItem(key, varKey) {
            templates[key].vars[varKey].push('');
            renderTemplateView(key);
        }

        function removeArrayItem(key, varKey, index) {
            templates[key].vars[varKey].splice(index, 1);
            renderTemplateView(key);
        }

        function resetDefaults(key) {
            templates[key].vars = JSON.parse(JSON.stringify(templateDefaults[key]));
            if(key === 'dns-lookup-tool') liveDnsResultCache['dns-lookup-tool'] = null;
            renderTemplateView(key);
        }

        function copyActiveTemplate(key) {
            const tmpl = templates[key];
            if(!tmpl) return;

            const finalString = (key === 'dns-lookup-tool' && liveDnsResultCache['dns-lookup-tool']) ? liveDnsResultCache['dns-lookup-tool'] : tmpl.getTemplate(tmpl.vars);

            if(navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(finalString).then(() => {
                    showToast();
                }).catch(() => {
                    fallbackCopy(finalString);
                });
            } else {
                fallbackCopy(finalString);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Failed to copy text', err);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Theme Switcher Initialization
        const themeToggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        if (localStorage.theme === 'dark') {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                htmlElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        // Mobile Sidebar Controls
        const sidebar = document.getElementById('sidebar');
        const openSidebarBtn = document.getElementById('openSidebar');
        const closeSidebarBtn = document.getElementById('closeSidebar');

        openSidebarBtn.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
        });

        closeSidebarBtn.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
        });

        // Initial Load
        window.onload = () => {
            switchTab('dns-managed-email-web');
